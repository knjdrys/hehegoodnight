<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Goodnight, Princess Ann 🌹</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="night">

        <div class="moon"></div>

        <div class="stars">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <main>

            <p class="intro">before you sleep...</p>

            <div class="rose">
                <div class="stem"></div>
                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>

                <div class="flower">
                    <div class="petal p1"></div>
                    <div class="petal p2"></div>
                    <div class="petal p3"></div>
                    <div class="petal p4"></div>
                    <div class="petal p5"></div>
                    <div class="center"></div>
                </div>
            </div>

            <section class="message">

                <h1>Goodnight, Princess Ann</h1>

                <p class="name">
                    Princess Ann Del Rosario
                </p>

                <p class="sorry">
                    I'm sorry for tonight.
                    <br>
                    I hope this little rose reminds you
                    that you are precious to me.
                </p>

                <p class="sleep">
                    Rest well, okay?
                    <br>
                    Goodnight. 🌹
                </p>

            </section>

        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
