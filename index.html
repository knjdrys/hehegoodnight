<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Princess Ann 🌹</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="sky">

        <div class="moon"></div>

        <div class="stars">
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
        </div>

        <div class="particles"></div>

    </div>


    <main class="page">

        <div class="intro">
            before you close your eyes tonight...
        </div>


        <!-- ROSE -->

        <div class="rose-scene">

            <div class="glow"></div>

            <div class="rose">

                <div class="stem"></div>

                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>

                <div class="flower">

                    <div class="petal petal-1"></div>
                    <div class="petal petal-2"></div>
                    <div class="petal petal-3"></div>
                    <div class="petal petal-4"></div>
                    <div class="petal petal-5"></div>
                    <div class="petal petal-6"></div>
                    <div class="petal petal-7"></div>

                    <div class="rose-center"></div>

                </div>

            </div>

        </div>


        <!-- MESSAGE -->

        <section class="message">

            <p class="to">
                For
            </p>

            <h1>
                Princess Ann
            </h1>

            <p class="full-name">
                Princess Ann Del Rosario
            </p>

            <div class="line"></div>

            <p class="apology">
                I'm sorry for tonight.
                <br><br>
                I know a simple sorry can't erase everything,
                but I hope this little rose reminds you that
                you are cared for and appreciated.
            </p>

            <p class="goodnight">
                Sleep peacefully tonight.
                <br>
                <span>Goodnight, Princess Ann. 🌹</span>
            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
