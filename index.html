<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Princess Ann</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;1,400;1,500&family=Petit+Formal+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grain"></div>

<div class="night">
  <div class="stars" id="stars"></div>
  <div class="fireflies" id="fireflies"></div>
  <div class="moon" id="moon"></div>
  <div class="candle-glow"></div>

  <div class="content">
    <p class="eyebrow">before you close your eyes tonight</p>

    <div class="rose-wrap" id="roseWrap">
      <svg viewBox="0 0 180 224" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="gOuter" cx="50%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#f0a3ae"/>
            <stop offset="55%" stop-color="#cf5b6c"/>
            <stop offset="100%" stop-color="#a53a4b"/>
          </radialGradient>
          <radialGradient id="gMid" cx="50%" cy="28%" r="75%">
            <stop offset="0%" stop-color="#dd7f8f"/>
            <stop offset="55%" stop-color="#b8455a"/>
            <stop offset="100%" stop-color="#87293c"/>
          </radialGradient>
          <radialGradient id="gInner" cx="50%" cy="26%" r="75%">
            <stop offset="0%" stop-color="#b8546a"/>
            <stop offset="60%" stop-color="#8a2e42"/>
            <stop offset="100%" stop-color="#5e1c2c"/>
          </radialGradient>
          <radialGradient id="gBud" cx="50%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#7a2a3c"/>
            <stop offset="100%" stop-color="#4a1522"/>
          </radialGradient>
          <linearGradient id="gLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#75935c"/>
            <stop offset="100%" stop-color="#4c6339"/>
          </linearGradient>
          <filter id="softShadow" x="-50%" y="-30%" width="200%" height="180%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="6" result="off"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <path class="stem" d="M 90 214 C 87 170, 93 138, 90 106" />
        <path class="thorn" d="M 90 178 L 84 172 L 90 174 Z" />

        <path class="leaf l1" fill="url(#gLeaf)" d="M 90 176 C 71 171, 56 180, 49 197 C 70 200, 85 191, 90 176 Z" />
        <path class="leaf-vein lv1" d="M 88 178 C 76 180, 63 186, 54 195" />
        <path class="leaf l2" fill="url(#gLeaf)" d="M 90 187 C 109 181, 124 190, 132 206 C 111 209, 96 200, 90 187 Z" />
        <path class="leaf-vein lv2" d="M 92 189 C 105 192, 117 198, 127 205" />

        <g class="rose-head" filter="url(#softShadow)">

          <g class="layer layer-outer">
            <path class="petal po" style="animation-delay:1.30s" fill="url(#gOuter)" transform="translate(90 104) rotate(-78) scale(1.08)" d="M 0,6 C -18,-3 -22,-26 0,-43 C 22,-26 18,-3 0,6 Z"/>
            <path class="petal po" style="animation-delay:1.37s" fill="url(#gOuter)" transform="translate(90 104) rotate(-4)  scale(1.18)" d="M 0,6 C -18,-3 -22,-26 0,-43 C 22,-26 18,-3 0,6 Z"/>
            <path class="petal po" style="animation-delay:1.44s" fill="url(#gOuter)" transform="translate(90 104) rotate(70)  scale(1.05)" d="M 0,6 C -18,-3 -22,-26 0,-43 C 22,-26 18,-3 0,6 Z"/>
            <path class="petal po" style="animation-delay:1.51s" fill="url(#gOuter)" transform="translate(90 104) rotate(142) scale(1.15)" d="M 0,6 C -18,-3 -22,-26 0,-43 C 22,-26 18,-3 0,6 Z"/>
            <path class="petal po" style="animation-delay:1.58s" fill="url(#gOuter)" transform="translate(90 104) rotate(214) scale(1.1)"  d="M 0,6 C -18,-3 -22,-26 0,-43 C 22,-26 18,-3 0,6 Z"/>
          </g>

          <g class="layer layer-mid">
            <path class="petal pm" style="animation-delay:1.68s" fill="url(#gMid)" transform="translate(90 102) rotate(-40) scale(0.88)" d="M 0,5 C -15,-2 -18,-23 0,-38 C 18,-23 15,-2 0,5 Z"/>
            <path class="petal pm" style="animation-delay:1.75s" fill="url(#gMid)" transform="translate(90 102) rotate(34)  scale(0.82)" d="M 0,5 C -15,-2 -18,-23 0,-38 C 18,-23 15,-2 0,5 Z"/>
            <path class="petal pm" style="animation-delay:1.82s" fill="url(#gMid)" transform="translate(90 102) rotate(104) scale(0.9)"  d="M 0,5 C -15,-2 -18,-23 0,-38 C 18,-23 15,-2 0,5 Z"/>
            <path class="petal pm" style="animation-delay:1.89s" fill="url(#gMid)" transform="translate(90 102) rotate(178) scale(0.84)" d="M 0,5 C -15,-2 -18,-23 0,-38 C 18,-23 15,-2 0,5 Z"/>
            <path class="petal pm" style="animation-delay:1.96s" fill="url(#gMid)" transform="translate(90 102) rotate(248) scale(0.87)" d="M 0,5 C -15,-2 -18,-23 0,-38 C 18,-23 15,-2 0,5 Z"/>
          </g>

          <g class="layer layer-inner">
            <path class="petal pi" style="animation-delay:2.05s" fill="url(#gInner)" transform="translate(90 101) rotate(15)  scale(0.56)" d="M 0,4 C -10,-3 -12,-19 0,-32 C 12,-19 10,-3 0,4 Z"/>
            <path class="petal pi" style="animation-delay:2.12s" fill="url(#gInner)" transform="translate(90 101) rotate(132) scale(0.52)" d="M 0,4 C -10,-3 -12,-19 0,-32 C 12,-19 10,-3 0,4 Z"/>
            <path class="petal pi" style="animation-delay:2.19s" fill="url(#gInner)" transform="translate(90 101) rotate(255) scale(0.58)" d="M 0,4 C -10,-3 -12,-19 0,-32 C 12,-19 10,-3 0,4 Z"/>
          </g>

          <g class="layer-center" style="animation-delay:1.05s">
            <path class="bud" fill="url(#gBud)" d="M 90,94 C 83,88 83,79 90,74 C 97,79 97,88 90,94 Z"/>
            <path class="bud bud-fold" d="M 90,93 C 87,88 88,82 90,78 C 92,82 93,88 90,93 Z"/>
          </g>

        </g>
      </svg>
      <div id="petalField"></div>
    </div>

    <div class="divider"><span class="dot"></span></div>

    <p class="for-label">for</p>
    <h1 class="name">Princess Ann</h1>
    <p class="fullname">Princess Ann Del Rosario</p>

    <p class="lead">I'm sorry for tonight.</p>

    <p class="body-text">
      I know a simple sorry can't erase everything, but I hope this little
      rose reminds you that you are cared for and appreciated.<br>
      Sleep peacefully tonight.
    </p>

    <div class="signature">
      <p class="signoff-script">Goodnight, Princess Ann</p>
      <svg class="flourish" viewBox="0 0 220 24" preserveAspectRatio="none">
        <path class="flourish-path" d="M4,6 C 40,20 80,-4 118,10 C 156,22 184,2 216,12" fill="none"/>
      </svg>
    </div>

    <p class="hint">tap the rose</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
